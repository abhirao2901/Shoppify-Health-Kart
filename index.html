<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shoppify Health Kart - Premium Health Supplements</title>
  <meta name="description" content="Premium health supplements — clean, effective, and science-backed. Shop the best vitamins, proteins, and wellness products." />
  
  <!-- GitHub Pages SPA routing fix -->
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
