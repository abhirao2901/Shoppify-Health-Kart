<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" stroke="#dee2e6" stroke-width="2" rx="8"/>
  <g transform="translate(200,200)">
    <!-- Bottle silhouette -->
    <path d="M-30,-80 L-30,-60 L-40,-40 L-40,60 Q-40,70 -30,70 L30,70 Q40,70 40,60 L40,-40 L30,-60 L30,-80 Z" fill="#adb5bd" opacity="0.3"/>
    <!-- Cap -->
    <rect x="-25" y="-85" width="50" height="10" rx="2" fill="#6c757d" opacity="0.4"/>
    <!-- Label area -->
    <rect x="-35" y="-20" width="70" height="40" rx="4" fill="#ffffff" opacity="0.6" stroke="#ced4da"/>
  </g>
  <text x="200" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">
    Product Image
  </text>
</svg>
