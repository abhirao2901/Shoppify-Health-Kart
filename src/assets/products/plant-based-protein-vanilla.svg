<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plantBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f8e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#plantBg)" stroke="#4caf50" stroke-width="3" rx="12"/>
  <g transform="translate(200,200)">
    <!-- Plant protein container -->
    <path d="M-50,-90 L-50,-50 L-60,-30 L-60,70 Q-60,85 -45,85 L45,85 Q60,85 60,70 L60,-30 L50,-50 L50,-90 Z" fill="#2e7d32" opacity="0.8"/>
    <!-- Lid -->
    <ellipse cx="0" cy="-90" rx="50" ry="8" fill="#1b5e20"/>
    <!-- Label -->
    <rect x="-45" y="-10" width="90" height="50" rx="6" fill="#ffffff" opacity="0.9" stroke="#4caf50"/>
    <!-- Plant leaves -->
    <path d="M-15,-20 Q-25,-25 -20,-35 Q-15,-25 -10,-30 Q-5,-20 0,-25 Q5,-20 10,-30 Q15,-25 20,-35 Q25,-25 15,-20" fill="#4caf50" opacity="0.7"/>
  </g>
  <text x="200" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">
    Plant Protein
  </text>
  <text x="200" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4caf50">
    Vanilla
  </text>
</svg>
