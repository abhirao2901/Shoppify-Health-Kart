<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="creatineBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ba68c8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#creatineBg)" stroke="#8e24aa" stroke-width="3" rx="12"/>
  <g transform="translate(200,200)">
    <!-- Powder container -->
    <path d="M-50,-90 L-50,-50 L-60,-30 L-60,70 Q-60,85 -45,85 L45,85 Q60,85 60,70 L60,-30 L50,-50 L50,-90 Z" fill="#7b1fa2" opacity="0.8"/>
    <!-- Lid -->
    <ellipse cx="0" cy="-90" rx="50" ry="8" fill="#4a148c"/>
    <!-- Label -->
    <rect x="-45" y="-10" width="90" height="50" rx="6" fill="#ffffff" opacity="0.9" stroke="#8e24aa"/>
    <!-- Powder texture -->
    <circle cx="-20" cy="20" r="2" fill="#ba68c8" opacity="0.6"/>
    <circle cx="-5" cy="25" r="2" fill="#ba68c8" opacity="0.6"/>
    <circle cx="10" cy="18" r="2" fill="#ba68c8" opacity="0.6"/>
    <circle cx="25" cy="22" r="2" fill="#ba68c8" opacity="0.6"/>
  </g>
  <text x="200" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#7b1fa2">Creatine</text>
  <text x="200" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8e24aa">Monohydrate</text>
</svg>
