<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vitaminBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff8e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcc02;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#vitaminBg)" stroke="#ff9800" stroke-width="3" rx="12"/>
  <g transform="translate(200,200)">
    <!-- Bottle -->
    <path d="M-25,-80 L-25,-60 L-35,-40 L-35,60 Q-35,70 -25,70 L25,70 Q35,70 35,60 L35,-40 L25,-60 L25,-80 Z" fill="#f57c00" opacity="0.8"/>
    <!-- Cap -->
    <rect x="-20" y="-85" width="40" height="10" rx="2" fill="#e65100"/>
    <!-- Label -->
    <rect x="-30" y="-20" width="60" height="40" rx="4" fill="#ffffff" opacity="0.9" stroke="#ff9800"/>
    <!-- Multi vitamin pills -->
    <circle cx="-8" cy="0" r="6" fill="#ff9800" opacity="0.6"/>
    <circle cx="8" cy="0" r="6" fill="#ffc107" opacity="0.6"/>
    <circle cx="0" cy="12" r="6" fill="#ffab00" opacity="0.6"/>
  </g>
  <text x="200" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f57c00">
    Multivitamin
  </text>
  <text x="200" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ff9800">
    Complete Daily
  </text>
</svg>
